name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - name: Unpack and build
        run: |
          unzip -q app-src.zip -d proj
          cd proj
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../PKT-Alarm.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: native-${{ github.run_number }}
          name: PKT Alarm ${{ github.run_number }}
          files: PKT-Alarm.apk
